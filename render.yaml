services:
  - type: web
    runtime: static
    name: butaca-fxumhujdmabgxjqmzoxs-frontend
    branch: pf25_MejorasVisuales
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://fxumhujdmabgxjqmzoxs.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_ltaNA7nnVozoSCOcZIjg
      - key: VITE_API_GATEWAY_URL
        value: https://butaca-fxumhujdmabgxjqmzoxs-gateway-7rkz.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
